<!-- =========================================================
     PROGRAM ZIUA NUNȚII
========================================================== -->

<article class="export-card">
    <div class="card-icon">
        ZN
    </div>

    <div>
    <span class="eyebrow">
      PDF
    </span>

        <h2>
            Program ziua nunții
        </h2>

        <p>
            Programul complet al zilei, cu ore, momente,
            responsabili, locații și observații.
        </p>
    </div>

    <button
            type="button"
            [disabled]="runningAction !== null"
            (click)="exportWeddingDay()"
    >
        {{
            isRunning('weddingDay')
                ? 'Se generează PDF...'
                : 'Descarcă programul PDF'
        }}
    </button>
</article>
